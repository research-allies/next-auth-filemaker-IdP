name: Publish to GitHub Packages

on:
  release:
    types: [published]

jobs:
  publish:
    name: Build, test, and publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4.2.2

      - name: Set up Node.js
        uses: actions/setup-node@v4.4.0
        with:
          node-version: "24"
          registry-url: "https://npm.pkg.github.com"
          scope: "@research-allies"

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Run tests
        run: npm test

      - name: Build
        run: npm run build

      - name: Publish
        run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload FileMaker file to release
        run: gh release upload "${{ github.ref_name }}" "FM files/IdP_Accounts.fmp12" --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
